<svg width="500" height="100" xmlns="http://www.w3.org/2000/svg">
<rect width="500" height="100" fill="#0d1117" rx="8"/>
<style>
text {
font-family: 'Courier New', Courier, monospace;
font-size: 36px;
font-weight: bold;
fill: #e6edf3;
}
.cursor {
fill: #e6edf3;
animation: blink 0.8s step-end infinite;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}

/*
Cycle: 10s
Type: char every 0.1s, 13 chars = 1.3s done at ~1.4s
Pause: until 4s
Delete: char every 0.1s from last to first, done at ~5.3s
Pause: until 10s → loop
*/

.c1 { animation: t1 10s step-end infinite; opacity:0; }
.c2 { animation: t2 10s step-end infinite; opacity:0; }
.c3 { animation: t3 10s step-end infinite; opacity:0; }
.c4 { animation: t4 10s step-end infinite; opacity:0; }
.c5 { animation: t5 10s step-end infinite; opacity:0; }
.c6 { animation: t6 10s step-end infinite; opacity:0; }
.c7 { animation: t7 10s step-end infinite; opacity:0; }
.c8 { animation: t8 10s step-end infinite; opacity:0; }
.c9 { animation: t9 10s step-end infinite; opacity:0; }
.c10 { animation: t10 10s step-end infinite; opacity:0; }
.c11 { animation: t11 10s step-end infinite; opacity:0; }
.c12 { animation: t12 10s step-end infinite; opacity:0; }
.c13 { animation: t13 10s step-end infinite; opacity:0; }

/* type in at Ns, delete out at (4 + (13-N)*0.1)s */
@keyframes t1 { 0%{opacity:0} 1%{opacity:1} 41%{opacity:1} 42%{opacity:0} 100%{opacity:0} }
@keyframes t2 { 0%{opacity:0} 2%{opacity:1} 40%{opacity:1} 41%{opacity:0} 100%{opacity:0} }
@keyframes t3 { 0%{opacity:0} 3%{opacity:1} 39%{opacity:1} 40%{opacity:0} 100%{opacity:0} }
@keyframes t4 { 0%{opacity:0} 4%{opacity:1} 38%{opacity:1} 39%{opacity:0} 100%{opacity:0} }
@keyframes t5 { 0%{opacity:0} 5%{opacity:1} 37%{opacity:1} 38%{opacity:0} 100%{opacity:0} }
@keyframes t6 { 0%{opacity:0} 6%{opacity:1} 36%{opacity:1} 37%{opacity:0} 100%{opacity:0} }
@keyframes t7 { 0%{opacity:0} 7%{opacity:1} 35%{opacity:1} 36%{opacity:0} 100%{opacity:0} }
@keyframes t8 { 0%{opacity:0} 8%{opacity:1} 34%{opacity:1} 35%{opacity:0} 100%{opacity:0} }
@keyframes t9 { 0%{opacity:0} 9%{opacity:1} 33%{opacity:1} 34%{opacity:0} 100%{opacity:0} }
@keyframes t10 { 0%{opacity:0} 10%{opacity:1} 32%{opacity:1} 33%{opacity:0} 100%{opacity:0} }
@keyframes t11 { 0%{opacity:0} 11%{opacity:1} 31%{opacity:1} 32%{opacity:0} 100%{opacity:0} }
@keyframes t12 { 0%{opacity:0} 12%{opacity:1} 30%{opacity:1} 31%{opacity:0} 100%{opacity:0} }
@keyframes t13 { 0%{opacity:0} 13%{opacity:1} 29%{opacity:1} 30%{opacity:0} 100%{opacity:0} }
</style>

<text x="30" y="62">
<tspan class="c1">H</tspan><tspan
class="c2">i</tspan><tspan
class="c3">,</tspan><tspan
class="c4"> </tspan><tspan
class="c5">I</tspan><tspan
class="c6">'</tspan><tspan
class="c7">m</tspan><tspan
class="c8"> </tspan><tspan
class="c9">L</tspan><tspan
class="c10">e</tspan><tspan
class="c11">s</tspan><tspan
class="c12">l</tspan><tspan
class="c13">y</tspan><tspan
class="cursor">█</tspan>
</text>
</svg>